# Four primary families. Validation ranks all four; BamiBERT is the declared
# deployment target even if another family wins. Test never changes selection.
seed: 42
deployment_family: bamibert
calibration_folds: 3
calibration_ensemble: false
feature_kinds: [word, char, combined]
min_df: [2, 3]
max_features: 50000  # per branch; combined can use up to 100000
preprocessing:
  lowercase: false
  normalize_urls: false
  normalize_mentions: false
models:
  svm:
    defaults: {C: 1.0, class_weight: null, max_iter: 5000}
    grid: {C: [0.1, 1.0, 5.0], class_weight: [null, balanced]}
  logistic_regression:
    defaults: {C: 1.0, class_weight: null, max_iter: 1000}
    grid: {C: [0.1, 1.0, 5.0], class_weight: [null, balanced]}
  phobert:
    backend: transformers
    model_id: vinai/phobert-base
    revision: main  # resolved once to a commit SHA and saved before training
    preprocessing: pyvi  # pragmatic segmenter; differs from pretraining VnCoreNLP
    defaults: {learning_rate: 0.00002}
    grid: {learning_rate: [0.00002]}
  bamibert:
    backend: transformers
    model_id: Qualcomm-AI-Research/BamiBERT
    revision: main
    preprocessing: raw
    defaults: {learning_rate: 0.00002}
    grid: {learning_rate: [0.00002]}
transformer_defaults:
  epochs: 3
  max_length: 128
  batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 2
  fp16: true  # enabled only on CUDA, automatically disabled on CPU
  device: auto  # CUDA when available; CPU otherwise
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 50
  gradient_checkpointing: false
# CPU timing includes preprocessing and tokenization, for Space comparison.
transformer_benchmark_repeats: 5
policy:
  criterion: max_f1
  max_clean_fpr: null
learning_curve_fractions: [0.25, 0.5, 0.75, 1.0]
bootstrap_repeats: 1000
