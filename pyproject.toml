[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safeview-ml"
version = "0.1.0"
description = "Reproducible Vietnamese comment classification experiments for CS114"
requires-python = ">=3.11,<3.14"
dependencies = [
  "scikit-learn>=1.6,<1.10", "numpy>=2,<3", "pandas>=2.2,<3",
  "scipy>=1.14,<2", "matplotlib>=3.9,<4", "PyYAML>=6,<7",
  "joblib>=1.4,<2", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "build>=1,<2", "setuptools>=75", "wheel>=0.45"]
hub = ["huggingface-hub>=0.28,<2", "pyarrow>=19"]
serve = ["gradio>=6,<7", "huggingface-hub>=0.28,<2"]

[project.scripts]
safeview-ml = "safeview_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
